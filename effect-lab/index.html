function rng(seed){let s=seed>>>0;return ()=>{s=(Math.imul(1664525,s)+1013904223)>>>0;return s/4294967296;}}

function render(c,p,t,w,h,particles=makeParticles(p)){

$("filter").append(new Option("전체 카테고리",""));for(const c of new Set(PRESETS.map(x=>x.category)))$("filter").append(new Option(c,c));$("filter").onchange=library;$("total").textContent=PRESETS.length+"종";library();refresh();
$("bg").onchange=()=>{$("stage").dataset.bg=$("bg").value;};$("play").onclick=()=>{if(t>=duration(p))t=0;playing=!playing;};$("restart").onclick=()=>{t=0;playing=true;};$("loop").onchange=()=>{p.loop=$("loop").checked;};$("time").oninput=()=>{playing=false;t=+ $("time").value/1000*duration(p);};$("random").onclick=()=>{p.seed=(Math.random()*4294967296)>>>0;particles=makeParticles(p);t=0;playing=true;};$("reset").onclick=()=>choose(p.id);
function frame(now){const dt=Math.min((now-last)/1000,.08);last=now;if(playing){t+=dt;if(t>=duration(p)){if(p.loop)t%=duration(p);else{t=duration(p);playing=false;}}}render($("view").getContext("2d"),p,t,640,480,particles);$("time").value=Math.round(t/duration(p)*1000);$("clock").textContent=t.toFixed(2)+"s";$("play").textContent=playing?"일시정지":"재생";requestAnimationFrame(frame);}requestAnimationFrame(frame);
function save(blob,name){const a=document.createElement("a"),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$("status").textContent=name+" 생성 완료";}
function config(){return {schema:"suaveforge.effect.v1",effect:p,duration:duration(p),sprite:{fps:24,frameWidth:256,frameHeight:256,columns:8,frames:Math.ceil(duration(p)*24)+1,origin:[.5,.6]}};}
$("json").onclick=()=>save(new Blob([JSON.stringify(config(),null,2)],{type:"application/json"}),p.id+".json");
function exportFrame(ctx,q,time){ctx.save();ctx.scale(256/640,256/480);render(ctx,q,time,640,480);ctx.restore();}
$("frame").onclick=()=>{const cv=document.createElement("canvas");cv.width=256;cv.height=256;exportFrame(cv.getContext("2d"),p,t);cv.toBlob(b=>save(b,p.id+"-frame.png"));};
$("sheet").onclick=()=>{const q=copy(p),n=Math.ceil(duration(q)*24)+1,cv=document.createElement("canvas"),cell=document.createElement("canvas");cell.width=cell.height=256;cv.width=2048;cv.height=Math.ceil(n/8)*256;const ctx=cv.getContext("2d");for(let i=0;i<n;i++){exportFrame(cell.getContext("2d"),q,Math.min(i/24,duration(q)));ctx.drawImage(cell,(i%8)*256,Math.floor(i/8)*256);}cv.toBlob(b=>save(b,q.id+"-24fps.png"));};
$("import").onclick=()=>$("file").click();$("file").onchange=async()=>{try{const data=JSON.parse(await $("file").files[0].text()),q=data.effect,base=PRESETS.find(x=>x.id===q?.id);if(data.schema!=="suaveforge.effect.v1"||!base)throw Error("지원하지 않는 형식");const next=copy(base);for(const [key,,min,max] of controls){if(!Number.isFinite(q[key]))throw Error("잘못된 값: "+key);next[key]=clamp(q[key],min,max);}if(!Array.isArray(q.colors)||q.colors.length!==base.colors.length||!q.colors.every(x=>/^#[0-9a-f]{6}$/i.test(x)))throw Error("잘못된 팔레트");next.colors=q.colors;next.seed=q.seed>>>0;next.loop=!!q.loop;p=next;t=0;refresh();$("status").textContent="불러오기 완료";}catch(e){$("status").textContent=e.message;}finally{$("file").value="";}};
</script></html>
