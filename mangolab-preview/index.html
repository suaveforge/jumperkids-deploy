ton class="mango-garden-toy mango-friend" data-mango="friend" aria-label="꼬마 망고와 놀기"><svg viewBox="0 0 100 110" aria-hidden="true"><defs><radialGradient id="friendFruitskin" cx=".29" cy=".22" r=".88"><stop stop-color="#fff8ac"/><stop offset=".38" stop-color="#ffda56"/><stop offset=".75" stop-color="#ffb42e"/><stop offset="1" stop-color="#f28b29"/></radialGradient><linearGradient id="friendFruitleaf" x2=".8" y2="1"><stop stop-color="#b7e568"/><stop offset="1" stop-color="#398a48"/></linearGradient></defs><g class="fruit-body"><path d="M56 25C36 14 13 27 9 53C4 79 24 99 45 101C66 103 89 83 92 59C96 37 76 21 56 25Z" fill="url(#friendFruitskin)" stroke="#fff9e8" stroke-width="5"/><path d="M21 49Q23 36 36 33" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="6" stroke-linecap="round"/><path d="M48 27Q47 17 54 12" stroke="#8f6036" stroke-width="6" fill="none" stroke-linecap="round"/><g class="fruit-leaf"><path d="M52 19Q57-1 91 7Q85 28 52 23Z" fill="url(#friendFruitleaf)" stroke="#f5ffe0" stroke-width="3"/><path d="M55 20L81 11" stroke="#e1f2a0" stroke-width="2" fill="none" stroke-linecap="round"/></g><g class="fruit-face" fill="#704428"><ellipse class="fruit-eye" cx="37" cy="59" rx="3.7" ry="5"/><ellipse class="fruit-eye" cx="62" cy="56" rx="3.7" ry="5"/><path d="M43 69Q51 77 57 67" fill="none" stroke="#704428" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="27" cy="69" rx="7" ry="4" fill="#f7977d" opacity=".75"/><ellipse cx="71" cy="65" rx="7" ry="4" fill="#f7977d" opacity=".75"/></g></g></svg><span class="friend-heart" aria-hidden="true">♥</span></button></div><dialog id="select"><h2></h2><p>현재는 로비 체험판입니다. 실제 게임 연결은 아직 되어 있지 않습니다.</p><button>돌아가기</button></dialog><span class="sr" aria-live="polite" id="status"></span></main><div id="world-transition" aria-hidden="true"><div class="travel-glow"></div><div class="travel-leaves"><i></i><i></i><i></i><i></i><i></i><i></i></div><img class="travel-art" alt=""><div class="travel-pages"><i></i><i></i></div></div><script>
const games=[["⚽", [523, 659]], ["🥕", [440, 587, 784]], ["♡", [587, 698]], ["🍃", [392, 523, 659]], ["🧱", [330, 392, 494]], ["✦", [523, 784, 1047]], ["♫", [392, 494, 587, 784]]];let sound=true,ctx;function tone(notes){if(!sound)return;try{ctx??=new (window.AudioContext||window.webkitAudioContext)();ctx.resume().catch(()=>{});const t=ctx.currentTime;notes.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),s=t+i*.095;o.type='sine';o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.035,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.17);o.connect(g);g.connect(ctx.destination);o.start(s);o.stop(s+.18)})}catch(e){}}function effect(el,txt,x=50,y=45){const p=document.createElement('span');p.className='effect';p.textContent=txt;p.style.setProperty('--x',x+'%');p.style.setProperty('--y',y+'%');el.append(p);setTimeout(()=>p.remove(),1000)}function react(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove(cls),1250)}document.querySelector('.sound').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'🔊':'🔇';e.currentTarget.setAttribute('aria-label',sound?'소리 끄기':'소리 켜기');e.currentTarget.setAttribute('aria-pressed',String(sound))};document.querySelector('.hero-art').onclick=e=>{react(e.currentTarget,'touched');effect(e.currentTarget,'✦',28,56);tone([523,659,784])};document.querySelectorAll('.scene').forEach(el=>el.onclick=()=>{const g=games[+el.dataset.id];react(el,'react');effect(el,g[0],70,45);tone(g[1]);document.querySelector('#status').textContent=el.getAttribute('aria-label')});const d=document.querySelector('#select');document.querySelectorAll('.play').forEach(el=>el.onclick=()=>{d.querySelector('h2').textContent=el.parentElement.querySelector('h2').textContent;tone([523,784]);d.showModal()});d.querySelector('button').onclick=()=>d.close();
document.querySelectorAll('[data-toy]').forEach(el=>el.addEventListener('click',()=>{const kind=el.dataset.toy;react(el,'burst');tone(({cloud:[523,659],balloon:[392,523,784],flower:[587,698,880],pinwheel:[440,587,659]})[kind]);document.querySelector('#status').textContent=el.getAttribute('aria-label')}));
/* Ambient play is purely visual; no autoplay sound, no forced game selection. */
let idleSince=performance.now(),ambientCount=0,ambientTimer;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const heroArt=document.querySelector('.hero-art');
const resetIdle=()=>{idleSince=performance.now()};
['pointerdown','keydown','touchstart'].forEach(type=>document.addEventListener(type,resetIdle,{passive:true}));
function ambientTick(){
 if(document.hidden||reduced.matches||d.open||performance.now()-idleSince<7200)return;
 idleSince=performance.now();
 ambientCount++;
 document.documentElement.dataset.ambientEvents=String(ambientCount);
 if(ambientCount%3===1){heroArt.classList.remove('ambient-wave');void heroArt.offsetWidth;heroArt.classList.add('ambient-wave');clearTimeout(ambientTimer);ambientTimer=setTimeout(()=>heroArt.classList.remove('ambient-wave'),1100)}
 else if(ambientCount%3===2){const visible=[...document.querySelectorAll('.mango-role')].filter(el=>el.getBoundingClientRect().height>0);if(visible.length){const el=visible[ambientCount%visible.length];el.querySelector('.role-reaction').textContent='✧';react(el,'cheer')}else effect(document.querySelector('.hero'),'✧',45,32)}
 else{const scene=document.querySelector('.band');if(scene.getBoundingClientRect().bottom>0&&scene.getBoundingClientRect().top<innerHeight)effect(scene,'♫',75,30)}
}
setInterval(ambientTick,900);
document.addEventListener('visibilitychange',()=>{document.documentElement.classList.toggle('page-sleep',document.hidden);resetIdle()});

/* V7 world navigation: actual separate views, browser back, focus and no forced selection. */
const entrance=document.querySelector('#world-entrance'), detail=document.querySelector('#world-detail'), worldTitle=document.querySelector('#world-title'), homeButton=document.querySelector('#world-home'), allCards=[...document.querySelectorAll('.card')];
const worldButtons=[...document.querySelectorAll('[data-world].world-portal')];
const worlds={village:{title:'놀이마을',emblem:'✿',ids:[0,1,2]},story:{title:'동화나라',emblem:'✦',ids:[3,4,5,6]}};
document.querySelectorAll('[data-sticker]').forEach(el=>{const n=+el.dataset.sticker;const source=allCards[n].querySelector('img.sprite');const img=document.createElement('img');img.src=source.src;img.alt='';img.draggable=false;el.append(img)});

const roleBays=[...document.querySelectorAll('.role-bay')], detailRoles=document.querySelector('#detail-roles'), travel=document.querySelector('#world-transition'), travelArt=travel.querySelector('.travel-art');
const roleInfo={professor:['✦',[523,659,784]],chef:['🥭',[392,523,659]],pig:['♥',[523,784]],pirate:['✧',[330,440,587]],wizard:['✦',[659,784,1047]],explorer:['♪',[440,587,784]]};
document.querySelectorAll('[data-role]').forEach(el=>el.addEventListener('click',()=>{const info=roleInfo[el.dataset.role];el.querySelector('.role-reaction').textContent=info[0];react(el,'cheer');tone(info[1]);resetIdle();document.querySelector('#status').textContent=el.getAttribute('aria-label')}));
function arrangeRoles(name){roleBays.forEach(b=>{const show=name==='home'||b.dataset.bay===name;b.hidden=!show;(name==='home'||!show?entrance:detailRoles).append(b)})}
let travelEnd=0;
function beginTravel(mode){
 if(reduced.matches)return;
 clearTimeout(travelEnd);travel.dataset.mode=mode;travelArt.src=mode==='home'?heroArt.querySelector('img').src:document.querySelector('.'+mode+'-portal .portal-art').src;
 travel.classList.remove('active');void travel.offsetWidth;travel.classList.add('active');
 travelEnd=setTimeout(()=>travel.classList.remove('active'),920)
}
let currentWorld='home',transitionTimer=0,transitioning=false,lastPortal=null;
const currentFromHash=()=>location.hash==='#village'?'village':location.hash==='#story'?'story':'home';
function renderWorld(name,focus=false){
 clearTimeout(transitionTimer);transitioning=false;worldButtons.forEach(b=>{b.classList.remove('entering');b.removeAttribute('aria-busy')});
 currentWorld=worlds[name]?name:'home';document.documentElement.dataset.world=currentWorld;
 if(d.open)d.close();
 entrance.hidden=currentWorld!=='home';detail.hidden=currentWorld==='home';arrangeRoles(currentWorld);
 allCards.forEach((card,i)=>{card.hidden=currentWorld==='home'||!worlds[currentWorld].ids.includes(i)});
 if(currentWorld!=='home'){
  const w=worlds[currentWorld];worldTitle.textContent=w.title;detail.querySelector('.world-emblem').textContent=w.emblem;
  detail.classList.remove('arriving');void detail.offsetWidth;detail.classList.add('arriving');
  if(focus){window.scrollTo(0,0);worldTitle.focus({preventScroll:true})}
 }else if(focus){window.scrollTo(0,0);(lastPortal||worldButtons[0]).focus({preventScroll:true})}
 resetIdle();
}
function navigateWorld(name){
 if(currentWorld===name||transitioning)return;
 if(name==='home'){if(!reduced.matches){transitioning=true;beginTravel('home');transitionTimer=setTimeout(()=>{history.pushState(null,'',location.pathname+location.search);renderWorld('home',true)},620)}else{history.pushState(null,'',location.pathname+location.search);renderWorld('home',true)}return}
 const portal=worldButtons.find(b=>b.dataset.world===name);if(!portal)return;
 lastPortal=portal;transitioning=true;portal.classList.add('entering');portal.setAttribute('aria-busy','true');
 tone(name==='village'?[523,659,784]:[659,784,1047]);beginTravel(name);resetIdle();
 const go=()=>{history.pushState(null,'',location.pathname+location.search+'#'+name);renderWorld(name,true)};
 if(reduced.matches)go();else transitionTimer=setTimeout(go,620);
}
worldButtons.forEach(b=>b.addEventListener('click',()=>navigateWorld(b.dataset.world)));
homeButton.addEventListener('click',()=>navigateWorld('home'));
window.addEventListener('popstate',()=>renderWorld(currentFromHash(),true));
window.addEventListener('hashchange',()=>{if(currentWorld!==currentFromHash())renderWorld(currentFromHash(),true)});
renderWorld(currentFromHash());

document.querySelectorAll('[data-mango]').forEach(el=>el.addEventListener('click',()=>{
 const tree=el.dataset.mango==='tree';react(el,tree?'harvest':'delight');tone(tree?[392,523,659]:[523,659,784]);resetIdle();document.querySelector('#status').textContent=tree?'망고가 통통 떨어졌어요':'꼬마 망고가 인사해요'
}));
</script></html>
