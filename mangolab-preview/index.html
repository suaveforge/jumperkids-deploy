/* V5: calm but tangible surroundings; original alpha stickers retained. */

.portal-picture{position:relative;height:clamp(270px,45vh,430px);overflow:hidden;isolation:isolate}
.portal-land{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.portal-sticker{position:absolute;display:block;pointer-events:none;filter:drop-shadow(0 5px 4px #634c3c26);transform-origin:50% 92%;animation:portalBob 5.6s ease-in-out infinite}
.portal-sticker img{display:block;width:100%;height:100%;object-fit:contain}
.vill-pup{width:32%;height:47%;left:4%;bottom:1%}.vill-chef{width:27%;height:46%;right:4%;bottom:4%;animation-delay:-2.3s}.vill-cat{width:24%;height:39%;left:39%;bottom:-2%;animation-delay:-3.5s}
.story-jack{width:31%;height:72%;left:1%;bottom:2%;animation-delay:-1.3s}.story-race{width:34%;height:44%;right:1%;bottom:2%;animation-delay:-3s}
.portal-clouds{animation:portalCloud 17s ease-in-out infinite;transform-origin:center}.story-portal .portal-clouds{animation-delay:-6s}
.portal-stars{animation:gentleGlint 5s ease-in-out infinite;transform-origin:center}
.portal-foliage{animation:gardenSway 5.8s ease-in-out infinite;transform-origin:center bottom}
.portal-trail{position:absolute;right:12%;top:12%;font-size:clamp(24px,4vw,46px);color:#fff7bf;filter:drop-shadow(0 1px 2px #b39a66);animation:gentleGlint 7s ease-in-out infinite;pointer-events:none}
.portal-label{display:flex;align-items:center;justify-content:center;gap:16px;position:relative;padding:15px 20px 18px;min-height:77px;font-size:clamp(30px,4vw,52px);font-weight:1000;letter-spacing:-.07em;line-height:1.1;background:linear-gradient(#fffef0,#edf5c9);color:#3f6a3e;border-top:4px solid #fff}
.story-portal .portal-label{background:linear-gradient(#fffaf2,#e9dafa);color:#68438d}
.portal-arrow{display:grid;place-items:center;position:absolute;right:18px;width:48px;height:48px;border-radius:50%;background:linear-gradient(#fff3ae,#ffbd49);border:3px solid white;box-shadow:0 3px 0 #ce963f;color:#6e4d24;font-size:27px;letter-spacing:0}
.story-portal .portal-arrow{background:linear-gradient(#e9c5ff,#be8de9);box-shadow:0 3px 0 #9870ba;color:#fff}
.world-portal:active .portal-picture{filter:saturate(1.06)}
.world-portal.entering .portal-picture{animation:enterWorld .56s cubic-bezier(.2,.7,.2,1) both}
.village-door{transform-origin:76px 175px;transform-box:view-box}.village-portal.entering .village-door{animation:doorOpen .5s ease-in-out both}
.book-leaf{transform-origin:0px 20px}.story-portal.entering .left-page{animation:pageOpen .5s ease-out both}.story-portal.entering .right-page{animation:pageOpen .5s ease-out both}
.world-portal.entering .portal-trail{animation:portalFlash .55s ease-out both}
@keyframes portalBob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
@keyframes portalCloud{0%,100%{transform:translateX(-8px)}50%{transform:translateX(12px)}}
@keyframes enterWorld{0%{transform:scale(1);opacity:1}100%{transform:scale(1.14);opacity:.6}}
@keyframes doorOpen{to{transform:scaleX(.12)}}
@keyframes pageOpen{0%{transform:scaleX(.72) rotate(-2deg)}100%{transform:scaleX(1) rotate(0)}}
@keyframes portalFlash{0%{transform:scale(.5);opacity:.4}60%{transform:scale(2);opacity:1}100%{transform:scale(2.5);opacity:0}}
.world-detail{margin-top:18px}
.world-detail.arriving{animation:worldArrive .44s ease-out both}
@keyframes worldArrive{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.world-heading{display:flex;position:relative;align-items:center;justify-content:center;margin:0 0 15px;min-height:78px;border-radius:28px;border:4px solid #fff;background:linear-gradient(120deg,#d9efb1,#f6f8d8);box-shadow:0 5px 0 #a9c28f70}
.world-heading h2{font-size:clamp(30px,4.5vw,48px);letter-spacing:-.07em;color:#3f6a3e;font-weight:1000;line-height:1;margin:0;text-shadow:0 2px white}
.world-heading h2:focus{outline:none}
.world-home{position:absolute;left:12px;display:flex;align-items:center;gap:7px;border:3px solid #fff;background:#fff9e8;border-radius:20px;padding:10px 15px;font-size:19px;font-weight:900;color:#6b4b2b;box-shadow:0 3px 0 #b9a474}
.world-home svg{width:22px;height:22px}.world-home:active{transform:translateY(2px)}
.world-emblem{position:absolute;right:20px;color:#679c59;font-size:34px}
html[data-world="story"] .world-heading{background:linear-gradient(120deg,#ddd0f7,#f8e5f9);box-shadow:0 5px 0 #baa4d780}
html[data-world="story"] .world-heading h2{color:#68438d}html[data-world="story"] .world-emblem{color:#976ac2}
html[data-world="story"] body{background:linear-gradient(180deg,#d5c9f7 0%,#f0e7fc 42%,#fff2d6 75%,#e7f0bf 100%)}
.world-detail .grid{grid-template-columns:repeat(12,minmax(0,1fr))}
html[data-world="village"] .world-detail .card{grid-column:span 4;height:clamp(235px,39vh,365px)}
html[data-world="story"] .world-detail .card{grid-column:span 3;height:clamp(235px,39vh,365px)}
.world-detail .foot{min-height:64px}.world-detail .foot h2{font-size:clamp(17px,2vw,27px)}
@media(max-width:700px){.world-entrance{grid-template-columns:1fr;gap:15px;margin-top:12px}.world-portal{border-width:4px;border-radius:25px}.portal-picture{height:clamp(150px,25vh,220px)}.portal-label{font-size:32px;min-height:51px;padding:8px 14px 11px;border-top-width:3px}.portal-arrow{width:36px;height:36px;right:13px;font-size:21px}.world-detail{margin-top:12px}.world-heading{min-height:59px;border-radius:21px;margin-bottom:12px}.world-heading h2{font-size:29px}.world-home{left:7px;padding:8px;border-radius:14px;gap:4px;font-size:14px}.world-home svg{width:18px;height:18px}.world-emblem{font-size:25px;right:11px}.world-detail .grid{grid-template-columns:repeat(2,minmax(0,1fr))}html[data-world="village"] .world-detail .card,html[data-world="story"] .world-detail .card{grid-column:span 1;height:clamp(151px,22vh,195px)}html[data-world="village"] .world-detail .card:nth-child(3){grid-column:span 2}.world-detail .foot{min-height:45px}.world-detail .foot h2{font-size:17px}}
@media(prefers-reduced-motion:reduce){.portal-sticker,.portal-clouds,.portal-stars,.portal-foliage,.portal-trail,.world-portal.entering .portal-picture,.world-portal.entering .village-door,.world-portal.entering .book-leaf,.world-detail.arriving{animation:none!important}}

/svg></span><span class="meadow-sparkle" aria-hidden="true">✧</span></div><dialog id="select"><h2></h2><p>현재는 로비 체험판입니다. 실제 게임 연결은 아직 되어 있지 않습니다.</p><button>돌아가기</button></dialog><span class="sr" aria-live="polite" id="status"></span></main><script>
const games=[["⚽", [523, 659]], ["🥕", [440, 587, 784]], ["♡", [587, 698]], ["🍃", [392, 523, 659]], ["🧱", [330, 392, 494]], ["✦", [523, 784, 1047]], ["♫", [392, 494, 587, 784]]];let sound=true,ctx;function tone(notes){if(!sound)return;try{ctx??=new (window.AudioContext||window.webkitAudioContext)();ctx.resume().catch(()=>{});const t=ctx.currentTime;notes.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),s=t+i*.095;o.type='sine';o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.035,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.17);o.connect(g);g.connect(ctx.destination);o.start(s);o.stop(s+.18)})}catch(e){}}function effect(el,txt,x=50,y=45){const p=document.createElement('span');p.className='effect';p.textContent=txt;p.style.setProperty('--x',x+'%');p.style.setProperty('--y',y+'%');el.append(p);setTimeout(()=>p.remove(),1000)}function react(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove(cls),1250)}document.querySelector('.sound').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'🔊':'🔇';e.currentTarget.setAttribute('aria-label',sound?'소리 끄기':'소리 켜기');e.currentTarget.setAttribute('aria-pressed',String(sound))};document.querySelector('.hero-art').onclick=e=>{react(e.currentTarget,'touched');effect(e.currentTarget,'✦',28,56);tone([523,659,784])};document.querySelectorAll('.scene').forEach(el=>el.onclick=()=>{const g=games[+el.dataset.id];react(el,'react');effect(el,g[0],70,45);tone(g[1]);document.querySelector('#status').textContent=el.getAttribute('aria-label')});const d=document.querySelector('#select');document.querySelectorAll('.play').forEach(el=>el.onclick=()=>{d.querySelector('h2').textContent=el.parentElement.querySelector('h2').textContent;tone([523,784]);d.showModal()});d.querySelector('button').onclick=()=>d.close();
document.querySelectorAll('[data-toy]').forEach(el=>el.addEventListener('click',()=>{const kind=el.dataset.toy;react(el,'burst');tone(({cloud:[523,659],balloon:[392,523,784],flower:[587,698,880],pinwheel:[440,587,659]})[kind]);document.querySelector('#status').textContent=el.getAttribute('aria-label')}));
/* Ambient play is purely visual; no autoplay sound, no forced game selection. */
let idleSince=performance.now(),ambientCount=0,ambientTimer;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const heroArt=document.querySelector('.hero-art');
const resetIdle=()=>{idleSince=performance.now()};
['pointerdown','keydown','touchstart'].forEach(type=>document.addEventListener(type,resetIdle,{passive:true}));
function ambientTick(){
 if(document.hidden||reduced.matches||d.open||performance.now()-idleSince<7200)return;
 idleSince=performance.now();
 ambientCount++;
 document.documentElement.dataset.ambientEvents=String(ambientCount);
 if(ambientCount%3===1){heroArt.classList.remove('ambient-wave');void heroArt.offsetWidth;heroArt.classList.add('ambient-wave');clearTimeout(ambientTimer);ambientTimer=setTimeout(()=>heroArt.classList.remove('ambient-wave'),1100)}
 else if(ambientCount%3===2){effect(document.querySelector('.hero'),'✧',45,32)}
 else{const scene=document.querySelector('.band');if(scene.getBoundingClientRect().bottom>0&&scene.getBoundingClientRect().top<innerHeight)effect(scene,'♫',75,30)}
}
setInterval(ambientTick,900);
document.addEventListener('visibilitychange',()=>{document.documentElement.classList.toggle('page-sleep',document.hidden);resetIdle()});

/* V7 world navigation: actual separate views, browser back, focus and no forced selection. */
const entrance=document.querySelector('#world-entrance'), detail=document.querySelector('#world-detail'), worldTitle=document.querySelector('#world-title'), homeButton=document.querySelector('#world-home'), allCards=[...document.querySelectorAll('.card')];
const worldButtons=[...document.querySelectorAll('[data-world].world-portal')];
const worlds={village:{title:'놀이마을',emblem:'✿',ids:[0,1,2]},story:{title:'동화나라',emblem:'✦',ids:[3,4,5,6]}};
document.querySelectorAll('[data-sticker]').forEach(el=>{const n=+el.dataset.sticker;const source=allCards[n].querySelector('img.sprite');const img=document.createElement('img');img.src=source.src;img.alt='';img.draggable=false;el.append(img)});
let currentWorld='home',transitionTimer=0,transitioning=false,lastPortal=null;
const currentFromHash=()=>location.hash==='#village'?'village':location.hash==='#story'?'story':'home';
function renderWorld(name,focus=false){
 clearTimeout(transitionTimer);transitioning=false;worldButtons.forEach(b=>{b.classList.remove('entering');b.removeAttribute('aria-busy')});
 currentWorld=worlds[name]?name:'home';document.documentElement.dataset.world=currentWorld;
 if(d.open)d.close();
 entrance.hidden=currentWorld!=='home';detail.hidden=currentWorld==='home';
 allCards.forEach((card,i)=>{card.hidden=currentWorld==='home'||!worlds[currentWorld].ids.includes(i)});
 if(currentWorld!=='home'){
  const w=worlds[currentWorld];worldTitle.textContent=w.title;detail.querySelector('.world-emblem').textContent=w.emblem;
  detail.classList.remove('arriving');void detail.offsetWidth;detail.classList.add('arriving');
  if(focus){window.scrollTo(0,0);worldTitle.focus({preventScroll:true})}
 }else if(focus){window.scrollTo(0,0);(lastPortal||worldButtons[0]).focus({preventScroll:true})}
 resetIdle();
}
function navigateWorld(name){
 if(currentWorld===name||transitioning)return;
 if(name==='home'){history.pushState(null,'',location.pathname+location.search);renderWorld('home',true);return}
 const portal=worldButtons.find(b=>b.dataset.world===name);if(!portal)return;
 lastPortal=portal;transitioning=true;portal.classList.add('entering');portal.setAttribute('aria-busy','true');
 tone(name==='village'?[523,659,784]:[659,784,1047]);resetIdle();
 const go=()=>{history.pushState(null,'',location.pathname+location.search+'#'+name);renderWorld(name,true)};
 if(reduced.matches)go();else transitionTimer=setTimeout(go,550);
}
worldButtons.forEach(b=>b.addEventListener('click',()=>navigateWorld(b.dataset.world)));
homeButton.addEventListener('click',()=>navigateWorld('home'));
window.addEventListener('popstate',()=>renderWorld(currentFromHash(),true));
window.addEventListener('hashchange',()=>{if(currentWorld!==currentFromHash())renderWorld(currentFromHash(),true)});
renderWorld(currentFromHash());
