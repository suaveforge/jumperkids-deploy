*{box-sizing:border-box}html{min-height:100%;background:#fff5d8}body{margin:0;color:#54301f;font-family:"Arial Rounded MT Bold","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:radial-gradient(ellipse at 50% 0,#fffefa 0,#fff4d5 60%,#f9e9af 100%);min-height:100svh}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:4px solid #8d4a10;outline-offset:4px}main{max-width:1260px;margin:auto;padding:12px 24px 20px}header{display:flex;align-items:center;justify-content:space-between;height:52px}.logo{width:260px;max-height:60px;object-fit:contain;object-position:left center;filter:drop-shadow(0 3px 2px #bc762b22)}.sound{border:3px solid white;background:#fff9e8;border-radius:24px;width:48px;height:44px;font-size:23px;box-shadow:0 3px 0 #d9ac57}.hero{height:152px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 34px;background:linear-gradient(120deg,#e2f7ff,#bfeaff);border:5px solid white;border-radius:32px;box-shadow:0 5px 0 #dfcb94;margin:9px 0 16px}.hero h1{font-size:clamp(30px,4vw,52px);letter-spacing:-.06em;margin:0;line-height:1.15;z-index:2;text-shadow:2px 3px white}.hero h1 strong{color:#e96c1a}.hero-art{position:relative;height:100%;width:46%;border:0;background:none;display:flex;justify-content:center;align-items:flex-start;isolation:isolate}.hero-art .mango{position:absolute;height:132%;top:-4%;right:7%;max-width:80%;object-fit:contain;object-position:top;filter:drop-shadow(0 4px 2px #81512422);transform-origin:50% 85%;animation:breathe 5.5s ease-in-out infinite}.hero-art .friend{position:absolute;height:77%;bottom:0;left:2%;animation:breathe 4.7s ease-in-out infinite;filter:drop-shadow(0 3px 2px #81512422)}.hero-art.touched .mango{animation:wave .8s ease-in-out}.hero-art.touched .friend{animation:hop .8s ease-in-out}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:13px}.card{grid-column:span 3;position:relative;display:flex;flex-direction:column;min-width:0;height:clamp(190px,29vh,252px);border:5px solid white;border-radius:27px;overflow:hidden;box-shadow:0 5px 0 #a6783233,0 8px 18px #92601a13;background:var(--bg)}.card:nth-child(n+5){grid-column:span 4}.scene{position:relative;flex:1;min-height:0;border:0;background:radial-gradient(ellipse at 50% 42%,#ffffff88,transparent 70%),var(--bg);overflow:hidden;isolation:isolate;width:100%;display:block}.scene:after{content:"";position:absolute;bottom:-15%;left:-10%;width:120%;height:37%;background:var(--floor);border-radius:50%;z-index:-1}.sprite{position:absolute;object-fit:contain;pointer-events:none;filter:drop-shadow(0 5px 3px #55301822);transform-origin:50% 85%;animation:breathe 5.2s ease-in-out infinite;animation-delay:var(--delay,0s)}.home .main{height:89%;width:64%;right:5%;bottom:0}.home .prop{height:75%;width:40%;left:0;bottom:0;animation:none}.chef .main,.cat .main,.band .main{height:98%;width:91%;left:4.5%;bottom:0}.jack .main{height:94%;width:75%;left:5%;bottom:0;z-index:1}.jack .vine{height:108%;width:48%;right:0;bottom:0;animation:none}.pigs .one{height:92%;width:51%;left:2%;bottom:0;z-index:2}.pigs .two{height:70%;width:34%;left:40%;bottom:4%;z-index:1}.pigs .three{height:59%;width:31%;right:0;bottom:0;z-index:3}.race .hare{height:92%;width:45%;left:6%;bottom:0}.race .turtle{height:76%;width:49%;right:3%;bottom:0;--delay:-1.6s}.foot{display:flex;align-items:center;justify-content:space-between;gap:4px;min-height:58px;padding:4px 8px 6px 12px;background:#fff9e9;border-top:3px solid #ffffffa0}.foot h2{font-size:clamp(17px,1.8vw,25px);letter-spacing:-.07em;font-weight:950;line-height:1.14;margin:0;word-break:keep-all}.play{flex:none;border:3px solid #fff;background:linear-gradient(#ffc55b,#ff8a19);box-shadow:0 2px 0 #bf681c;width:45px;height:45px;border-radius:50%;color:white;font-weight:900;font-size:22px;display:grid;place-items:center;padding:0}.play:active{transform:scale(.92)}.scene:active .main{scale:.97}.scene.react .main{animation:hop .85s ease-in-out}.chef.react .main{animation:toss .9s ease-in-out}.cat.react .main{animation:wiggle .8s ease-in-out}.jack.react .main{animation:climb .95s ease-in-out}.pigs.react .one{animation:hop .8s ease-in-out}.pigs.react .two{animation:hop .8s .14s ease-in-out}.pigs.react .three{animation:hop .8s .28s ease-in-out}.race.react .hare{animation:race .9s ease-in-out}.race.react .turtle{animation:crawl .9s ease-in-out}.band.react .main{animation:dance 1s ease-in-out}.effect{position:absolute;z-index:4;font-size:clamp(24px,4vw,42px);pointer-events:none;animation:pop .9s ease-out both;left:var(--x,50%);top:var(--y,45%)}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.016,.984)}}@keyframes hop{0%,100%{transform:none}25%{transform:translateY(6%) scale(1.07,.91)}55%{transform:translateY(-10%) scale(.97,1.05)}}@keyframes wave{0%,100%{transform:none}20%,65%{transform:rotate(-7deg) translateY(-3%)}45%,85%{transform:rotate(5deg)}}@keyframes toss{0%,100%{transform:none}30%{transform:rotate(-8deg) translateY(-7%)}65%{transform:rotate(5deg)}}@keyframes wiggle{0%,100%{transform:none}25%,75%{transform:rotate(-5deg)}50%{transform:rotate(5deg) translateY(-3%)}}@keyframes climb{0%,100%{transform:none}30%{transform:translate(8%,-9%) rotate(4deg)}65%{transform:translate(12%,-17%) rotate(-5deg)}}@keyframes race{0%,100%{transform:none}35%{transform:translate(20%,-12%) rotate(5deg)}65%{transform:translate(34%,0)}}@keyframes crawl{0%,100%{transform:none}45%{transform:translate(8%,-3%)}75%{transform:translate(16%,0)}}@keyframes dance{0%,100%{transform:none}20%,65%{transform:rotate(-7deg) translateY(-5%)}42%,85%{transform:rotate(6deg) translateY(-3%)}}@keyframes pop{0%{opacity:0;transform:translate(-50%,0) scale(.4)}25%{opacity:1;transform:translate(-50%,-40%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-150%) scale(.8)}}dialog{border:5px solid white;border-radius:28px;padding:22px;background:#fff6d9;color:#54301f;max-width:min( const games=[["⚽", [523, 659]], ["🥕", [440, 587, 784]], ["♡", [587, 698]], ["🍃", [392, 523, 659]], ["🧱", [330, 392, 494]], ["✦", [523, 784, 1047]], ["♫", [392, 494, 587, 784]]];let sound=true,ctx;function tone(notes){if(!sound)return;try{ctx??=new (window.AudioContext||window.webkitAudioContext)();ctx.resume().catch(()=>{});const t=ctx.currentTime;notes.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),s=t+i*.095;o.type='sine';o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.035,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.17);o.connect(g);g.connect(ctx.destination);o.start(s);o.stop(s+.18)})}catch(e){}}function effect(el,txt,x=50,y=45){const p=document.createElement('span');p.className='effect';p.textContent=txt;p.style.setProperty('--x',x+'%');p.style.setProperty('--y',y+'%');el.append(p);setTimeout(()=>p.remove(),1000)}function react(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove(cls),1250)}document.querySelector('.sound').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'🔊':'🔇';e.currentTarget.setAttribute('aria-label',sound?'소리 끄기':'소리 켜기');e.currentTarget.setAttribute('aria-pressed',String(sound))};document.querySelector('.hero-art').onclick=e=>{react(e.currentTarget,'touched');effect(e.currentTarget,'✦',28,56);tone([523,659,784])};document.querySelectorAll('.scene').forEach(el=>el.onclick=()=>{const g=games[+el.dataset.id];react(el,'react');effect(el,g[0],70,45);tone(g[1]);document.querySelector('#status').textContent=el.getAttribute('aria-label')});const d=document.querySelector('#select');document.querySelectorAll('.play').forEach(el=>el.onclick=()=>{d.querySelector('h2').textContent=el.parentElement.querySelector('h2').textContent;tone([523,784]);d.showModal()});d.querySelector('button').onclick=()=>d.close();</script></html>
