draw=function(m,t){originalDraw(m,t);front(m,t);let layer=q('qaProp');if(!layer){layer=document.createElementNS(NS,'g');layer.id='qaProp';mount.append(layer);}layer.innerHTML='';if(!['eat','drink','pick','carry'].includes(m))return;const p=pose(m,t),h=world(p,...hand(p,'R'));let x=h[0],y=h[1],a=0,shape=apple;if(m==='eat'){x-=5;y-=8;}if(m==='drink'){x-=3;y-=11;a=-15*p.sip;shape='<path d="M-10 -13H10L7 12H-7Z" fill="#9bb8dc" stroke="#495a70" stroke-width="2"/><ellipse cy="-13" rx="10" ry="3" fill="#dce8f6" stroke="#495a70" stroke-width="1.5"/>';}if(m==='pick'){if(p.holding){y+=15;}else{x=63;y=81;}}if(m==='carry'){const l=world(p,...hand(p,'L'));x=(h[0]+l[0])/2;y=(h[1]+l[1])/2-9;shape='<rect x="-24" y="-14" width="48" height="27" rx="4" fill="#e7b774" stroke="#826345" stroke-width="2"/><path d="M-24 -6H24M0 -14V13" stroke="#ad8b55" stroke-width="1.6"/>';}layer.innerHTML='<g transform="translate('+x+' '+y+') rotate('+a+')">'+shape+'</g>';if(m==='carry'){const body=q('body');for(const side of ['L','R']){const pt=world(p,...hand(p,side));const g=document.createElementNS(NS,'g');g.setAttribute('transform','translate('+pt[0]+' '+pt[1]+')');g.innerHTML='<ellipse rx="7" ry="9" fill="'+palettes[seed%4][0]+'" stroke="#493b38" stroke-width="2.3"/>';layer.append(g);}}};
install=function(s){seed=((s%COUNT)+COUNT)%COUNT;originalInstall(seed);q('status').textContent=q('status').textContent.replace(' ·',' / 31 ·');const select=q('characterSelect');if(select)select.value=String(seed);};
const chooser=document.createElement('select');chooser.id='characterSelect';chooser.setAttribute('aria-label','캐릭터 선택');chooser.style.cssText='font:inherit;padding:8px;border:1px solid #deded4;border-radius:9px;background:white;max-width:100%';for(let i=0;i<COUNT;i++){const o=document.createElement('option');o.value=i;o.textContent='캐릭터 '+String(i+1).padStart(2,'0');chooser.append(o);}chooser.onchange=()=>install(Number(chooser.value));q('next').before(chooser);q('next').onclick=()=>install(seed+1);

window.JKLab={generate,pose,renderAt:(m,t)=>{paused=true;setMotion(m);draw(m,t)},install:(s)=>{seed=s;install(s)},getRig:()=>rig,motions:Object.keys(labels)};install(0);requestAnimationFrame(loop);
