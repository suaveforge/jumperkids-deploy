<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jumper Kids | Character Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f3eb;color:#303a37;font:16px system-ui,sans-serif}main{max-width:980px;margin:auto;padding:24px}h1{font-size:29px;margin:0 0 5px;letter-spacing:-1px}p{margin:5px 0 18px;color:#656e64}section{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}.stage,.panel{border:1px solid #deded4;background:#fffdf6;border-radius:20px;overflow:hidden}.stage{align-self:start}.stage svg{display:block;width:100%;height:auto}.panel{padding:18px}h2{font-size:16px;margin:10px 0}button{font:inherit;color:inherit;background:white;border:1px solid #deded4;border-radius:9px;padding:9px 12px;cursor:pointer}button.active{background:#2d6c59;color:white;border-color:#2d6c59}button:focus-visible{outline:3px solid #eeb64d}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.small{font-size:13px;color:#666e63}.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:15px}.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.headrow span{background:#e4efdf;border-radius:20px;padding:6px 11px;font-size:12px;white-space:nowrap}.foot{margin-top:16px;font-size:13px;color:#656e64} @media(max-width:720px){main{padding:12px}section{grid-template-columns:1fr}h1{font-size:24px}.buttons button{padding:8px 5px}}
</style><main><div class="headrow"><div><h1>Jumper Kids · Character Lab</h1><p>2D original character / automated rig prototype</p></div><span>ISOLATED LAB</span></div><section><div class="stage"><svg id="stage" viewBox="0 0 440 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated original 2D character"><defs><pattern id="wall" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.5" fill="#d9e6d9"/></pattern></defs><rect width="440" height="440" fill="#eaf2e3"/><rect width="440" height="307" fill="url(#wall)"/><path d="M0 308H440V440H0Z" fill="#e7d8bb"/><path d="M0 308H440" stroke="#c6bba0" stroke-width="3"/><rect x="22" y="23" width="128" height="36" rx="18" fill="#fffdf6"/><text x="86" y="46" text-anchor="middle" fill="#396552" font-size="14" font-weight="700">MOTION LAB</text><ellipse id="shadow" cx="220" cy="383" rx="65" ry="12" fill="#a59578" opacity=".3"/><g id="mount" transform="translate(220 290)"></g><text id="motionLabel" x="220" y="420" text-anchor="middle" fill="#4f5e4c" font-size="16" font-weight="700">Idle</text></svg></div><div class="panel"><h2>기본 동작</h2><div class="buttons" id="basic"></div><h2>감정 표현</h2><div class="buttons" id="emotion"></div><h2>상호작용</h2><div class="buttons" id="action"></div><div class="toolbar"><button id="next">다음 캐릭터</button><button id="pause">일시 정지</button><button id="export">파츠·리깅 저장</button></div><p class="small" id="status" style="margin:14px 0 0"></p></div></section><div class="foot">원본 벡터 파츠 자동 생성 · 공통 관절 · 코드 기반 모션 · 게임 독립 시연 / 운영 배포 아님</div></main><script>
'use strict';
const NS='http://www.w3.org/2000/svg';
const groups=[['basic',['idle','blink','walk','run','jump','sit','lie']],['emotion',['laugh','cry','angry','surprise','shy','sleep','happy']],['action',['eat','drink','pick','carry','wave','clap','dance']]];
const labels={idle:'대기',blink:'눈 깜빡임',walk:'걷기',run:'달리기',jump:'점프',sit:'앉기',lie:'눕기',laugh:'웃기',cry:'울기',angry:'화내기',surprise:'놀라기',shy:'부끄러움',sleep:'졸기',happy:'기뻐하기',eat:'먹기',drink:'마시기',pick:'집기',carry:'들기',wave:'손 흔들기',clap:'박수',dance:'춤추기'};
const palettes=[['#dca27d','#44302d','#f2ad44','#426d5f','#f7f1e4'],['#9c644c','#382b41','#ed8b8e','#536ba7','#fce9cd'],['#f0c6a3','#a75a37','#8db5a4','#6b568e','#fff0d3'],['#c58d65','#302f36','#a8a1d9','#bf6c52','#f9efd9']];
let seed=0,motion='idle',paused=false,start=performance.now(),frozen=0,rig;
const mount=document.getElementById('mount');
function generate(s){const [skin,hair,shirt,pants,shoe]=palettes[s%palettes.length];const outline='#493b38';const line=`stroke="${outline}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"`;
const hairFront=s%2===0?`<path d="M-61 -4Q-70 -66 -19 -78Q40 -91 61 -49L65 -1Q47 -8 32 -31Q5 -11 -22 -34Q-39 -9 -61 -4Z" fill="${hair}" ${line}/><path d="M-25 -64Q-8 -72 8 -67" stroke="#fff" opacity=".17" stroke-width="4" fill="none" stroke-linecap="round"/>`:`<path d="M-63 3Q-77 -67 -27 -79Q0 -97 30 -77Q76 -71 64 3L48 -6Q38 -39 9 -36Q-11 -52 -37 -27L-52 5Z" fill="${hair}" ${line}/><circle cx="-46" cy="-57" r="21" fill="${hair}"/><circle cx="40" cy="-61" r="23" fill="${hair}"/>`;
const parts={
 head:`<ellipse cx="-59" cy="3" rx="13" ry="17" fill="${skin}" ${line}/><ellipse cx="59" cy="3" rx="13" ry="17" fill="${skin}" ${line}/><path d="M-62 -23Q-64 -75 0 -78Q64 -75 62 -23L61 13Q57 51 0 53Q-57 51 -61 13Z" fill="${skin}" ${line}/>${hairFront}<circle cx="-45" cy="21" r="9" fill="#d97f76" opacity=".55"/><circle cx="45" cy="21" r="9" fill="#d97f76" opacity=".55"/><path d="M-4 15Q0 18 4 15" fill="none" stroke="#a96950" stroke-width="2" stroke-linecap="round"/>`,
 torso:`<path d="M-11 -62H11L14 -44H-14Z" fill="${skin}" ${line}/><path d="M-27 -55Q-45 -51 -44 -30L-34 28Q0 38 34 28L44 -30Q45 -51 27 -55L14 -55Q0 -39 -14 -55Z" fill="${shirt}" ${line}/><path d="M-13 -55Q0 -39 13 -55" fill="none" ${line}/><path d="M-12 -13Q0 -25 12 -13Q12 0 0 7Q-12 0 -12 -13Z" fill="#fff3ce" opacity=".9"/><path d="M-32 24H32L27 43H-27Z" fill="${pants}" ${line}/>`,
 upperArm:`<rect x="-11" y="-8" width="22" height="33" rx="10" fill="${shirt}" ${line}/><path d="M-9 20H9" ${line}/>`,
 foreArm:`<rect x="-9" y="-5" width="18" height="29" rx="9" fill="${skin}" ${line}/><path d="M-9 19Q-15 20 -12 27L-8 30Q-6 37 1 36Q10 35 10 27L10 23Q8 19 4 20" fill="${skin}" ${line}/>`,
 upperLeg:`<rect x="-13" y="-6" width="26" height="32" rx="10" fill="${pants}" ${line}/>`,
 lowerLeg:`<rect x="-10" y="-5" width="20" height="27" rx="8" fill="${skin}" ${line}/><path d="M-12 16Q-3 12 9 16L12 24L19 27Q23 36 14 38H-12Q-17 35 -16 28Z" fill="${shoe}" ${line}/><path d="M-14 32H18" stroke="${outline}" stroke-width="1.7"/>`,
 eyes:`<g id="eyeL"><ellipse cx="-23" cy="0" rx="6.4" ry="9.5" fill="#322d2b"/><circle cx="-21" cy="-3" r="2" fill="white"/></g><g id="eyeR"><ellipse cx="23" cy="0" rx="6.4" ry="9.5" fill="#322d2b"/><circle cx="25" cy="-3" r="2" fill="white"/></g>`,
 brows:`<path id="browL" d="M-31 -15Q-23 -20 -15 -15" fill="none" ${line}/><path id="browR" d="M15 -15Q23 -20 31 -15" fill="none" ${line}/>`,
 mouth:`<path id="mouthShape" d="M-8 27Q0 34 8 27" fill="none" stroke="#613b39" stroke-width="2.8" stroke-linecap="round"/>`,
 tears:`<g fill="#75c8e6"><path d="M-28 9Q-37 22 -28 25Q-19 22 -28 9Z"/><path d="M28 9Q19 22 28 25Q37 22 28 9Z"/></g>`};
const pivots={head:[0,-60],torso:[0,0],armL:[-38,-42],armR:[38,-42],foreL:[0,24],foreR:[0,24],legL:[-16,34],legR:[16,34],shinL:[0,24],shinR:[0,24]};
const parents={head:"body",torso:"body",armL:"body",armR:"body",foreL:"armL",foreR:"armR",legL:"body",legR:"body",shinL:"legL",shinR:"legR"}; return {seed:s,parts,pivots,parents};}
function install(s){rig=generate(s);const p=rig.parts;mount.innerHTML=`<g id="root"><g id="body"><g id="legL">${p.upperLeg}<g id="shinL">${p.lowerLeg}</g></g><g id="legR">${p.upperLeg}<g id="shinR">${p.lowerLeg}</g></g><g id="armL">${p.upperArm}<g id="foreL">${p.foreArm}</g></g><g id="torso">${p.torso}</g><g id="armR">${p.upperArm}<g id="foreR">${p.foreArm}<g id="prop" visibility="hidden"></g></g></g><g id="head">${p.head}<g id="eyes">${p.eyes}</g><g id="brows">${p.brows}</g><g id="mouth">${p.mouth}</g><g id="tears" visibility="hidden">${p.tears}</g></g></g></g>`;document.getElementById('status').textContent=`캐릭터 ${String(s+1).padStart(2,'0')} · 원본 파츠 ${Object.keys(p).length}종 · 공통 모션 ${Object.keys(labels).length}종`;setMotion(motion);}
const q=id=>document.getElementById(id);function tr(id,x,y,a=0,sx=1,sy=1){q(id).setAttribute('transform',`translate(${x} ${y}) rotate(${a}) scale(${sx} ${sy})`)};
function pose(m,t){const w=Math.sin(t*2*Math.PI),v=Math.cos(t*2*Math.PI),slow=Math.sin(t*Math.PI);let p={x:0,y:0,body:0,head:0,al:12,ar:-12,fl:0,fr:0,ll:0,lr:0,sl:0,sr:0,sx:1,sy:1,eye:1,face:'smile',tears:false,prop:''};p.y=1.5*w;p.head=1.5*slow;if(m==='blink')p.eye=Math.abs(w)>.78?.08:1;
if(m==='walk'||m==='run'){let k=m==='run'?1.65:1;Object.assign(p,{al:12+30*w*k,ar:-12-30*w*k,ll:-28*w*k,lr:28*w*k,sl:25*Math.max(0,w),sr:25*Math.max(0,-w),y:-Math.abs(v)*9*k,body:m==='run'?7:2,x:6*w});}
if(m==='jump'){let h=Math.max(0,Math.sin(t*Math.PI));Object.assign(p,{y:-70*h,al:30+95*h,ar:-30-95*h,ll:15*h,lr:-15*h,sl:25*h,sr:25*h,face:'open'});}
if(m==='sit')Object.assign(p,{y:20, ll:-65,lr:65,sl:80,sr:-80,al:26,ar:-26,head:4});
if(m==='lie'||m==='sleep')Object.assign(p,{x:-25,y:48,body:-82,head:7,eye:m==='sleep'?.08:1,al:8,ar:-8,face:m==='sleep'?'small':'smile'});
if(m==='laugh')Object.assign(p,{face:'open',eye:.15,head:6*w,al:24,ar:-24,y:-Math.abs(w)*6});
if(m==='cry')Object.assign(p,{face:'sad',eye:.35,tears:true,head:4*w,al:18,ar:-18});
if(m==='angry')Object.assign(p,{face:'angry',head:3*w,al:33,ar:-33,fl:45,fr:-45});
if(m==='surprise')Object.assign(p,{face:'o',eye:1.25,al:45,ar:-45,y:-Math.abs(w)*5});
if(m==='shy')Object.assign(p,{head:12,eye:.75,al:18,ar:-38,fr:-80,face:'small'});
if(m==='happy')Object.assign(p,{face:'open',al:130+15*w,ar:-130-15*w,y:-Math.abs(w)*22,eye:.65});
if(m==='eat'||m==='drink')Object.assign(p,{ar:62,fr:95+12*w,head:5*w,face:Math.abs(w)>.4?'o':'smile',prop:m==='eat'?'apple':'cup'});
if(m==='pick')Object.assign(p,{body:18+12*w,head:-10,ar:25+20*w,fr:15,y:16+5*w,prop:'apple'});
if(m==='carry')Object.assign(p,{al:-35,ar:35,fl:-55,fr:55,prop:'box'});
if(m==='wave')Object.assign(p,{ar:-135,fr:28*w,head:5*w,face:'open'});
if(m==='clap')Object.assign(p,{al:-55-12*w,ar:55+12*w,fl:-38,fr:38,face:'open'});
if(m==='dance')Object.assign(p,{x:15*w,y:-Math.abs(w)*10,body:10*w,head:-12*w,al:75+50*w,ar:-75+50*w,ll:-20*w,lr:20*w,face:'open'});return p;}
function draw(m,t){const p=pose(m,t);tr('root',p.x,p.y,0,p.sx,p.sy);tr('body',0,0,p.body);for(const [id,a] of Object.entries({head:p.head,torso:0,armL:p.al,armR:p.ar,foreL:p.fl,foreR:p.fr,legL:p.ll,legR:p.lr,shinL:p.sl,shinR:p.sr})){const [x,y]=rig.pivots[id];tr(id,x,y,a)}tr('eyeL',0,0,0,1,p.eye);tr('eyeR',0,0,0,1,p.eye);q('tears').setAttribute('visibility',p.tears?'visible':'hidden');q('browL').setAttribute('transform',p.face==='angry'?'rotate(22 -23 -15)':'');q('browR').setAttribute('transform',p.face==='angry'?'rotate(-22 23 -15)':'');const mouths={smile:'M-8 27Q0 34 8 27',small:'M-4 29Q0 32 4 29',sad:'M-8 33Q0 25 8 33',angry:'M-8 30H8',open:'M-11 25Q0 30 11 25Q10 41 0 41Q-10 41 -11 25Z',o:'M0 23A7 9 0 1 1 0 41A7 9 0 1 1 0 23Z'};q('mouthShape').setAttribute('d',mouths[p.face]);q('mouthShape').setAttribute('fill',['o','open'].includes(p.face)?'#613b39':'none');const prop=q('prop');prop.setAttribute('visibility',p.prop?'visible':'hidden');prop.innerHTML=p.prop==='apple'?'<g transform="translate(0 39)"><circle r="11" fill="#d96a5b" stroke="#824b3b" stroke-width="2"/><path d="M0 -10L3 -16" stroke="#55704a" stroke-width="3"/></g>':p.prop==='cup'?'<path d="M-9 29H9L7 49H-7Z" fill="#9bb8dc" stroke="#495a70" stroke-width="2"/>':p.prop==='box'?'<rect x="-20" y="25" width="40" height="27" rx="4" fill="#e7b774" stroke="#826345" stroke-width="2"/>':'';q('shadow').setAttribute('rx',String(65+Math.min(0,p.y)*.27));}
function setMotion(m){if(!(m in labels))throw Error('unknown motion');motion=m;start=performance.now();frozen=0;q('motionLabel').textContent=labels[m];document.querySelectorAll('[data-motion]').forEach(b=>{const a=b.dataset.motion===m;b.classList.toggle('active',a);b.setAttribute('aria-pressed',String(a))});draw(m,0)}
function loop(now){if(!paused){let speed=motion==='run'?1.8:motion==='walk'?1.15:.8;frozen=(now-start)/1000*speed;draw(motion,motion==='jump'?frozen%1:frozen)}requestAnimationFrame(loop)}
for(const [group,keys] of groups){for(const k of keys){const b=document.createElement('button');b.dataset.motion=k;b.textContent=labels[k];b.onclick=()=>setMotion(k);q(group).append(b)}}
q('next').onclick=()=>install(++seed);q('pause').onclick=()=>{paused=!paused;if(!paused)start=performance.now();q('pause').textContent=paused?'재생':'일시 정지'};q('export').onclick=()=>{const data={format:'jk-2d-vector-rig-v1',...rig,motions:Object.keys(labels)};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jk-character-'+seed+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
window.JKLab={generate,pose,renderAt:(m,t)=>{paused=true;setMotion(m);draw(m,t)},install:(s)=>{seed=s;install(s)},getRig:()=>rig,motions:Object.keys(labels)};install(0);requestAnimationFrame(loop);
</script></html>
