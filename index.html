<style>

w,23px);display:block}.dialog p{font-size:clamp(12px,1.3vw,17px);line-height:1.35;margin:6px 0 0}.bottom{position:absolute;bottom:18px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:end;gap:10px}.basket{background:#ffffffeb;border:4px solid white;border-radius:24px;padding:10px 15px;box-shadow:0 8px 25px #63416838;font-size:clamp(17px,2vw,25px);font-weight:1000}.hint{background:#ffffffdb;border-radius:16px;padding:10px 14px;max-width:38%;font-size:clamp(11px,1.15vw,15px);font-weight:800;text-align:right}.bounce{animation:bounce 2.2s ease-in-out infinite}.float{animation:float 3.4s ease-in-out infinite}.glow{animation:glow 1.6s ease-in-out infinite}@keyframes bounce{50%{transform:translateY(-9px)}}@keyframes float{50%{transform:translateY(-6px)}}@keyframes glow{50%{filter:drop-shadow(0 0 16px #fff3c0)}}.hidden{display:none!important}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 8px;color:#55446d;font-size:13px}.footer button{font-size:13px;border:2px solid white;background:#fffafa;border-radius:13px;padding:9px 12px;font-weight:900;color:#684e89;cursor:pointer}.report{position:fixed;inset:0;background:#2b234ba8;z-index:4;display:grid;place-items:center;padding:20px}.report-card{background:#fffdf5;border-radius:26px;width:min(440px,95vw);padding:26px;box-shadow:0 20px 80px #1c163855}.report-card h2{margin:0}.report-card p{line-height:1.7}.report-card button{border:0;border-radius:14px;background:#7459b7;color:white;font-weight:800;padding:14px;width:100%;cursor:pointer}.water{animation:float 4s infinite ease-in-out;transform-origin:50% 50%}@media(max-width:660px){body{padding:0;background:#e5c2eb}.shell{height:100%;display:flex;flex-direction:column;justify-content:center}.banner{padding:6px 10px;font-size:13px}.dev{font-size:9px}.game{border-width:3px;border-radius:16px}.dialog{top:7px;left:7px;border-width:2px;border-radius:14px;padding:7px 9px;max-width:46%}.dialog p{margin-top:3px}.top-actions{top:7px;right:7px;gap:3px}.bubble-button{width:48px;height:48px;border-radius:15px;border-width:2px;font-size:24px}.bottom{bottom:7px;left:8px;right:8px}.basket{font-size:14px;padding:6px 9px;border-radius:13px;border-width:2px}.hint{font-size:10px;max-width:39%;padding:6px 9px}.footer{padding:5px 12px;font-size:10px}.footer button{padding:5px 7px;font-size:10px}}@media(max-width:480px) and (orientation:portrait){.game{aspect-ratio:4/5}.game svg{width:100%;height:100%;object-fit:cover}.dialog{max-width:58%}.bottom .hint{display:none}.footer{flex-wrap:wrap}.banner{font-size:11px}.bubble-button{width:44px;height:44px;font-size:22px}}

<div class="report hidden" id="report" role="dialog" aria-modal="true" aria-labelledby="reportTitle"><div class="report-card"><h2 id="reportTitle">🌷 오늘의 놀이 이야기</h2><p id="reportBody"></p><p style="font-size:12px;color:#837b91">개발용 로컬 이벤트만 표시합니다. 교육 효과를 측정하거나 개인정보를 저장하지 않습니다.</p><button id="closeReport">마을로 돌아가기</button></div></div>
<script>
'use strict';
const state={hatched:false,picked:new Set(),bakery:false,house:false,pets:0,events:[]};
const byId=id=>document.getElementById(id);
const tell=(title,text,hint)=>{byId('dialogTitle').textContent=title;byId('dialogText').textContent=text;byId('hintText').textContent=hint};
function record(type){state.events.push({type,at:Date.now()});}
function render(){
 byId('egg').classList.toggle('hidden',state.hatched);
 byId('dragon').classList.toggle('hidden',!state.hatched);
 for(let n=1;n<=3;n++){const el=document.querySelector('[data-action="berry-'+n+'"]');el.style.opacity=state.picked.has(n)?'.3':'1';el.setAttribute('aria-disabled',state.picked.has(n)?'true':'false')}
 byId('basketText').textContent='🧺 딸기 '+state.picked.size+' / 3';
 byId('basket').classList.toggle('hidden',state.picked.size===0);
 byId('basket-icons').textContent='🍓'.repeat(state.picked.size);
}
function action(name){
 if(name==='egg'){
  if(state.hatched){tell('🐉 반가워!','친구가 방긋 웃으며 따라와!','딸기를 찾아보자!');return}
  state.hatched=true;state.pets=1;record('pet_hatched');
  tell('🐉 용 친구가 태어났어!','우리 같이 토끼 빵집에 가볼까?','🍓 딸기 세 개를 찾아보자');render();return;
 }
 if(name==='dragon'){
  if(!state.hatched)return;
  record('pet_petted');tell('💕 친구가 좋아해!','용이 살랑살랑 꼬리를 흔들어.','딸기 덤불을 톡 터치해 봐!');return;
 }
 if(name.startsWith('berry-')){
  if(!state.hatched){tell('🥚 먼저 친구를 만나자!','반짝이는 알을 살짝 눌러 줘.','알부터 터치해 봐');return}
  const number=Number(name.split('-')[1]);
  if(state.picked.has(number)){tell('🍓 이미 딴 딸기야!','다른 덤불에도 딸기가 있어.','다른 딸기 덤불을 찾아봐!');return}
  state.picked.add(number);record('strawberry_picked');
  if(state.picked.size===3)tell('🎉 딸기 세 개 완성!','이제 오른쪽 토끼 빵집에 가져가자.','빵집 토끼를 터치해 봐!');
  else tell('🍓 딸기를 찾았어!','지금 '+state.picked.size+'개야. 다른 딸기는 어디 있을까?','딸기 그림이 있는 덤불을 찾아봐!');
  render();return;
 }
 if(name==='bakery'){
  if(!state.hatched){tell('🐰 토끼가 기다리고 있어!','먼저 반짝이는 알에서 친구를 만나자.','알을 톡 터치해 봐!');return}
  if(state.picked.size<3){tell('🐰 토끼의 부탁','빵 위에 올릴 딸기 세 개를 가져와 줘!','딸기 '+(3-state.picked.size)+'개를 더 찾아봐!');return}
  if(state.bakery){tell('🎂 케이크가 완성됐어!','토끼가 고마워하며 손을 흔들어.','이제 우리집을 꾸며보자!');return}
  state.bakery=true;record('bakery_completed');
  tell('🎂 딸기 케이크 완성!','토끼가 행복하게 춤을 춰! 우리집도 꾸밀까?','🏠 왼쪽 우리집을 눌러봐!');return;
 }
 if(name==='home'){
  if(!state.hatched){tell('🏠 이 집은 누구 집일까?','우리 친구를 먼저 만나면 같이 꾸밀 수 있어!','알을 먼저 눌러봐!');return}
  if(!state.bakery){tell('🏠 여기가 우리집이야!','먼저 토끼 빵집에 딸기를 가져다주자.','오른쪽 빵집에 가보자!');return}
  if(!state.house){state.house=true;record('house_decorated');tell('🌸 집에 꽃이 피었어!','와! 내가 꾸민 우리집이야. 오늘 정말 멋졌어!','오늘의 놀이가 완성됐어!')}
  else tell('🏠 멋진 우리집!','우리 친구와 언제든 더 놀 수 있어.','보호자 리포트도 확인할 수 있어!');
  return;
 }
}
document.querySelectorAll('[data-action]').forEach(el=>{
 el.addEventListener('click',()=>action(el.dataset.action));
 el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action(el.dataset.action)}});
});
byId('homeButton').addEventListener('click',()=>action('home'));
byId('bagButton').addEventListener('click',()=>tell('🎒 나의 바구니','딸기 '+state.picked.size+'개를 모았어!','🍓 덤불을 눌러 과일을 모아봐!'));
byId('resetButton').addEventListener('click',()=>{state.hatched=false;state.picked.clear();state.bakery=false;state.house=false;state.pets=0;state.events=[];tell('✨ 신기한 알이 있어!','반짝이는 알을 톡 눌러볼까?','알을 터치하면 친구가 나와!');render()});
byId('parentPreview').addEventListener('click',()=>{
 const count=t=>state.events.filter(e=>e.type===t).length;
 byId('reportBody').textContent='펫 탄생: '+count('pet_hatched')+'회 · 딸기 집기: '+count('strawberry_picked')+'회 · 빵집 완료: '+count('bakery_completed')+'회 · 집 꾸미기: '+count('house_decorated')+'회. 모두 실제 데모 행동 이벤트 수만 표시합니다.';
 byId('report').classList.remove('hidden');
});
byId('closeReport').addEventListener('click',()=>byId('report').classList.add('hidden'));
render();
</script>
</body>
</html>
