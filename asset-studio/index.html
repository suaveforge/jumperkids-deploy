const svg=$('studioStage');function coords(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}svg.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-uid]');if(!g)return;selected=Number(g.dataset.uid);const i=find(),p=coords(e);drag={uid:i.uid,dx:p.x-i.x,dy:p.y-i.y};svg.setPointerCapture(e.pointerId);controls();});svg.addEventListener('pointermove',e=>{if(!drag)return;const p=coords(e),i=items.find(x=>x.uid===drag.uid);if(i){i.x=Math.max(65,Math.min(475,p.x-drag.dx));i.y=Math.max(76,Math.min(260,p.y-drag.dy));}});for(const event of ['pointerup','pointercancel','lostpointercapture'])svg.addEventListener(event,()=>drag=null);function tick(now){if(tab==='assets'){for(const g of [...$layer.children])if(!items.some(i=>i.uid===Number(g.dataset.uid)))g.remove();for(const i of items){const d=D[i.id],u=i.effect?Math.min(1,(now-i.effect.t)/950):0,dy=i.effect?.k==='bounce'?-32*Math.sin(Math.PI*u):0,angle=i.effect?.k==='roll'?u*360:0;if(u===1)i.effect=null;const s={...i.s,time:now/1000,phase:i.s.on||i.s.happy||i.s.walk?now/1000%1:i.effect?u:0};let g=$layer.querySelector('[data-uid="'+i.uid+'"]');if(!g){g=document.createElementNS(ns,'g');g.dataset.uid=i.uid;g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',d.name);g.style.cursor='grab';g.innerHTML='<circle r="62" fill="transparent" stroke-dasharray="5 4"/><g class="asset-art"/><text y="83" text-anchor="middle" font-size="13" fill="#43584b">'+d.name+'</text>';$layer.append(g);}g.setAttribute('transform','translate('+i.x+' '+(i.y+dy)+')');g.firstElementChild.setAttribute('stroke',selected===i.uid?'#397b61':'transparent');const art=g.querySelector('.asset-art');art.setAttribute('transform','rotate('+angle+')');let markup=d.draw(s);if(s.walk&&d.kind==='animal'){const step=12*Math.sin(now/1000*8);markup=markup.replace(/(<rect x="-4" y="20"[^>]*\/>)/,'<g transform="rotate('+step+' 2 20)">$1</g>').replace(/(<rect x=" function addFxControls(host,kind){
